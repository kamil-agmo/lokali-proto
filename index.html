<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lokali</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/mark-colour.svg">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <script src="shell.config.js?v=0.35.1"></script>
  <script src="js/shell/split.js?v=0.35.1"></script>
  <link rel="stylesheet" href="css/shell/prototype.css?v=0.35.1">
  <link rel="stylesheet" href="css/shell/admin-shell.css?v=0.35.1">
  <link rel="stylesheet" href="css/shell/phone-frame.css?v=0.35.1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=chevron_right,lock,replay,warning">
</head>
<body>
  <!-- Lock screen: covers the whole page until the password is in -->
  <iframe id="lockscreen" class="lockscreen" src="pages/lock.html" title="Lock screen"></iframe>
  <div class="shell">

    <!-- Left: page list and controls -->
    <aside class="side side--left" id="sideLeft" aria-label="Pages">
      <div class="brand" id="brand"><img class="brand__logo" id="brandLogo" alt="" hidden><span class="brand__name" id="brandName"></span><span class="brand__tag" id="brandTag"></span></div>
      <nav id="pagenav" class="pagenav"></nav>
      <div class="side__actions">
        <button id="replay" class="replay" type="button"><span class="mi" style="font-size:16px" aria-hidden="true">replay</span><span id="replayLabel">Replay intro</span></button>
      </div>
    </aside>

    <!-- Centre: the screen, where pages load (scaled to fit the window). A device skill draws its frame around it:
         dd-iphone-david (iPhone), dd-iphone-duo-kamil (iPhone Duo); dd-desktop-kamil shows desktop pages full-window.
         Without one, pages show in this plain screen. -->
    <main class="stage" id="stage">
      <div class="phone" id="phone">
        <div class="phone__screen">
          <iframe id="screen" title="Prototype screen" src="about:blank"></iframe>
        </div>
      </div>
    </main>

    <!-- Right: summary of the page on screen. The row above it is the add-on slot: dd-dev-mode-kamil, dd-designer-mode-kamil and
         dd-design-system-kamil put their buttons there (it stays hidden while empty) -->
    <aside class="side side--right" id="sideRight" aria-label="Page summary" aria-live="polite">
      <div class="side__top" id="addons"></div>
      <div id="summary" class="summary"></div>
    </aside>
  </div>

  <!-- Side-card drawers (js/shell/drawers.js): add-ons (admin pages, the open iPhone Duo) show these tabs when the side cards have no room -->
  <button class="edgetab edgetab--left" id="tabNav" type="button" aria-controls="sideLeft" aria-expanded="false" hidden>Navigation</button>
  <button class="edgetab edgetab--right" id="tabSum" type="button" aria-controls="sideRight" aria-expanded="false" hidden>Summary</button>
  <div class="drawerbg" id="drawerBg" hidden></div>

  <script src="js/shell/prototype.js?v=0.35.1"></script>
  <script src="js/shell/phone-frame.js?v=0.35.1"></script>
  <script src="js/shell/theme.js?v=0.35.1"></script>
  <script src="js/shell/drawers.js?v=0.35.1"></script>
  <script src="js/shell/admin-shell.js?v=0.35.1"></script>
  <script src="js/shell/appearance.js?v=0.35.1"></script>
  <script src="js/shell/credits.js?v=0.35.1"></script>
  <script src="js/shared/credits-data.js?v=0.35.1"></script>
  <script src="js/shared/credits-badge.js?v=0.35.1"></script>
</body>
</html>
