<style>
/* Listings in Airy (27 Nov): Aina's live listing as a Home-style photo card, her draft as an open row; one "New listing" pill.
   Cut: the second "Create new listing" button (same as the header pill), the Calendar button (it's a tab) and the boxed cards. */
.ls-main { padding: 8px 24px calc(var(--home) + 120px); }
.ls-new { position: relative; flex: none; min-height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--font); color: var(--ink); cursor: pointer; }
.ls-new::after { content: ""; position: absolute; inset: -6px 0; }
.ls-new .ph { font-size: 16px; }
.ls-card { display: block; color: var(--ink); cursor: pointer; }
.ls-card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 26px; background: var(--sand); }
.ls-body { padding: 14px 2px 0; }
.ls-state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink); }
.ls-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.ls-state.draft i { background: #B0B0B0; }
.ls-title { margin: 4px 0 0; font-size: 16px !important; line-height: 21px !important; font-weight: 600 !important; letter-spacing: 0 !important; }
.ls-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 0 6px; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--muted); }
.ls-meta .ph-fill { color: var(--star); font-size: 13px; } .ls-meta b { font-weight: 600; color: var(--ink); }
.ls-acts { display: flex; gap: 8px; margin-top: 12px; }
.ls-pill { position: relative; min-height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--font); color: var(--ink) !important; text-decoration: none; cursor: pointer; }
.ls-pill::after { content: ""; position: absolute; inset: -6px 0; }
.ls-pill .ph { font-size: 16px; }
.ls-sec { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
.ls-row { display: flex; gap: 14px; align-items: center; margin-top: 12px; color: var(--ink); cursor: pointer; }
.ls-ph { flex: none; width: 72px; height: 72px; border-radius: 20px; background: var(--sand); display: grid; place-items: center; font-size: 24px; color: var(--faint); }
.ls-row .grow { min-width: 0; }
.ls-state.draft { font-weight: 400; font-size: 12px; color: var(--muted); }
.ls-row b { display: block; margin-top: 2px; font-size: 16px; line-height: 21px; font-weight: 600; }
.ls-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.ls-bar > span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; } .ls-bar > span i { display: block; height: 100%; background: var(--ink); }
.ls-note { margin-top: 20px; font-size: 12px; line-height: 17px; color: var(--muted); }
</style>
<style>
  .lr { display: flex; align-items: center; gap: 14px; padding: 14px 0; color: var(--ink); cursor: pointer; }
  .lr + .lr-acts + .lr, .lr-acts + .lr { border-top: 1px solid var(--line); }
  .lr-th { width: 88px; height: 88px; flex: none; border-radius: 20px; object-fit: cover; background: var(--sand); }
  .lr-empty { display: grid; place-items: center; background: #F7F7F7; color: var(--muted); font-size: 26px; }
  .lr .grow { min-width: 0; } .lr b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; margin-top: 2px; }
  .lr small { display: block; font-size: 12px; line-height: 17px; color: var(--muted); margin-top: 2px; } .lr small .ph-fill { color: var(--star); }
  .lr-st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink); } .lr-st i { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); } .lr-st.draft i { background: #B0B0B0; }
  .lr-bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; } .lr-bar i { display: block; height: 100%; background: var(--ink); }
  .lr .chev { color: var(--faint); font-size: 16px; }
  .lr-acts { padding: 0 0 14px 102px; }
</style>
</head>
<body class="m">
<div class="lt-bar" aria-hidden="true">Listings</div>
<header class="lt"><div class="lt-row"><h1>Listings</h1><button class="ls-new" data-go="h-builder" onclick="L.state.set('hbuild','new')"><i class="ph ph-plus" aria-hidden="true"></i>New listing</button></div></header>

<main class="ls-main">
  <!-- Listings as a list (27 Nov, explore/host-pass.html #4): one row per listing, 88 px photo, status in words + dot -->
  <a class="lr" href="h-builder.html" data-go="h-builder" onclick="L.state.set('hbuild','kuih')">
    <img class="lr-th" data-img="1643188626775-05290d1b6acb" data-w="240" alt="">
    <div class="grow"><span class="lr-st"><i aria-hidden="true"></i>Live since Fri, 20 Nov</span><b>Forest-edge farm walk &amp; kuih morning</b><small><i class="ph-fill ph-star" aria-hidden="true"></i> 5.0 (3) · RM 85 / adult</small><small>Next: Sat, 5 Dec · 6 of 8</small></div>
    <i class="ph ph-caret-right chev" aria-hidden="true"></i>
  </a>
  <div class="lr-acts"><a class="ls-pill" href="g-listing.html" data-go="g-listing" onclick="L.state.set('exp','kuih');L.state.set('preview',true)"><i class="ph ph-eye" aria-hidden="true"></i>Preview as guest</a></div>
  <div class="lr" role="link" tabindex="0" data-go="h-builder" onclick="L.state.set('hbuild','pandan')">
    <span class="lr-th lr-empty"><i class="ph ph-image" aria-hidden="true"></i></span>
    <div class="grow"><span class="lr-st draft"><i aria-hidden="true"></i>Draft · edited Tue, 1 Dec</span><b>Pandan dye workshop</b><small>6 of 11 required done</small><span class="lr-bar"><i style="width:55%"></i></span></div>
    <i class="ph ph-caret-right chev" aria-hidden="true"></i>
  </div>
  <p class="ls-note">The Lokali team checks each new listing before it goes live.</p>
</main>
