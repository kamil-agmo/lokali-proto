<style>
/* Calendar in Airy (2 Dec, Aina's one listing): large title + Add slot pill, plain month grid (ink circle = selected),
   one dot per slot (grey open, ink booked, red full), struck-out blocked days; the chosen day below as open rows. */
.hc { padding: 0 24px calc(var(--home, 0px) + 120px); }
.lt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hc-add { min-height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--font); color: var(--ink); cursor: pointer; position: relative; }
.hc-add::after { content: ""; position: absolute; inset: -6px 0; }
.hc-add .ph { font-size: 16px; }
.hc-lead { margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--muted); }
.hc-month { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }
.hc-month h2 { font-size: 18px; line-height: 24px; font-weight: 700; }
.hc-month .icon-btn { width: 44px; height: 44px; }
.hc-dow, .hc-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
.hc-dow { margin-top: 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted); }
.hc-grid { row-gap: 4px; margin-top: 8px; }
.hc-grid button { position: relative; height: 48px; border: 0; background: none; font: 500 15px/1 var(--font); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding-top: 4px; }
.hc-grid .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.hc-grid .past { color: var(--faint); }
.hc-grid .today .n { box-shadow: inset 0 0 0 1px var(--ink); }
.hc-grid .sel .n { background: var(--ink); color: #fff; box-shadow: none; }
.hc-grid .blocked .n { color: var(--faint); text-decoration: line-through; }
.hc-grid .dot { width: 6px; height: 6px; border-radius: 50%; }
.hc-o { background: #C4C4C4; } .hc-b { background: var(--ink); } .hc-f { background: var(--danger); }
.hc-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; font-size: 12px; line-height: 16px; color: var(--muted); }
.hc-legend span { display: inline-flex; align-items: center; gap: 6px; }
.hc-legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.hc-legend s { color: var(--faint); }
.hc-day { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); }
.hc-day h2 { font-size: 18px; line-height: 24px; font-weight: 700; }
.hc-row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 0; color: var(--ink); }
.hc-row + .hc-row { border-top: 1px solid var(--line); }
.hc-row[data-slot] { cursor: pointer; }
.hc-row > div { flex: 1; min-width: 0; }
.hc-row b { display: block; font-size: 15px; line-height: 21px; font-weight: 600; }
.hc-row small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
.hc-row .cap { flex: none; font-size: 13px; font-weight: 600; color: var(--ink); }
.hc-row .cap.full { color: var(--danger); }
.hc-row .chev { flex: none; color: var(--faint); font-size: 18px; }
.hc-row .switch { flex: none; }
.hc-none { padding: 12px 0 4px; font-size: 13px; line-height: 18px; color: var(--muted); }
.hc-none a { color: var(--primary); font-weight: 600; }
</style>
<style>
  /* Calendar (27 Nov, explore/host-pass.html #1): fill bar under each bookable date, selected date in ink, the day's slot as Today's dark tile */
  .hc-grid button { position: relative; }
  .hc-grid button .dot { display: none; }
  .hc-fill { display: block; width: 22px; height: 4px; border-radius: 2px; background: #EBEBEB; margin: 4px auto 0; overflow: hidden; } .hc-fill b { display: block; height: 100%; background: var(--ink); }
  .hc-grid button.sel { background: var(--ink) !important; color: #fff !important; border-radius: 14px !important; }
  .hc-grid button.sel .hc-fill { background: rgba(255,255,255,.3); } .hc-grid button.sel .hc-fill b { background: #fff; }
  .hc-grid button.blocked .n { text-decoration: line-through; color: var(--muted); }
  .hc-tile { position: relative; display: flex; flex-direction: column; margin-top: 4px; padding: 14px 16px; border-radius: 20px; background: #222; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.18); cursor: pointer; }
  .hc-tile + .hc-tile { margin-top: 10px; }
  .hc-tile .chev { position: absolute; top: 14px; right: 14px; color: #fff; font-size: 16px; }
  .hc-tile .w { font-size: 13px; color: rgba(255,255,255,.78); } .hc-tile .w b { color: #fff; }
  .hc-tile .tt { font-size: 17px; line-height: 22px; font-weight: 700; margin-top: 2px; }
  .hc-tile .cp { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: rgba(255,255,255,.78); } .hc-tile .cp .b { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); overflow: hidden; } .hc-tile .cp .b i { display: block; height: 100%; background: #fff; }
  .hc-tile .al { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.78); } .hc-tile .al em { font-style: normal; color: #FF9C9C; }
</style>
</head>
<body class="m">
<div class="lt-bar" aria-hidden="true">Calendar</div>
<header class="lt"><div class="lt-row"><h1>Calendar</h1><button class="hc-add" data-go="h-slot"><i class="ph ph-plus" aria-hidden="true"></i>Add slot</button></div>
  <p class="hc-lead">Every Saturday, 9:00 AM · 8 guests per class</p></header>

<main class="hc">
  <section aria-label="December 2026">
    <div class="hc-month">
      <button class="icon-btn" aria-label="Previous month" data-toast="November 2026"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
      <h2>December 2026</h2>
      <button class="icon-btn" aria-label="Next month" data-toast="January 2027"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
    </div>
    <div class="hc-dow" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="hc-grid" id="grid"></div>
  </section>

  <section class="hc-day" aria-labelledby="dayTitle">
    <h2 id="dayTitle">Sat, 5 Dec</h2>
    <div id="slots"></div>
    <div class="hc-row"><div><b>Block this date</b><small>No new bookings</small></div><button class="switch" id="block" role="switch" aria-checked="false" aria-label="Block this date"></button></div>
  </section>
</main>

<nav class="tabbar" data-tabs="host" data-active="h-calendar"></nav>

  <script>
  (function () {
    /* December 2026 (1 Dec is a Tuesday). Recurring: Saturdays 9:00 AM. One-off: Sun 20 Dec. Blocked: Sat 26 Dec. Capacity 8; a slot closes when full. */
    var CAP = 8, TODAY = 2, sel = 5;
    var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    function dow(d) { return (d % 7 + 7) % 7; } /* 0 Mon … 6 Sun: d=1 → 1 (Tue) */
    var blocked = { 26: 1 };
    var booked = { 5: 6 };                 /* Sat 5 Dec: 6 of 8 (L.hosting.next) */
    var oneOff = { 20: '9:00 AM' };        /* school holidays */
    var extra = {};                        /* slots added on Add slot, this session */
    var added = L.state.get('hSlotAdded', null);
    if (added) {
      L.state.set('hSlotAdded', null);
      if (added.type === 'one' && added.d) { extra[added.d] = added.t; sel = added.d; }
      if (added.type === 'rec' && added.days) { for (var d0 = 1; d0 <= 31; d0++) if (added.days.indexOf(dow(d0)) > -1 && d0 >= TODAY) extra[d0] = added.t; sel = Object.keys(extra).map(Number).sort(function (a, b) { return a - b; })[0] || sel; }
      setTimeout(function () { L.toast(added.n + (added.n === 1 ? ' slot added' : ' slots added')); }, 300);
    }
    function end(t) { /* class is 2.5 hours */
      var m = t.match(/(\d+):(\d+) (AM|PM)/), h = (+m[1] % 12) + (m[3] === 'PM' ? 12 : 0), mins = h * 60 + +m[2] + 150, eh = Math.floor(mins / 60), em = mins % 60;
      return ((eh % 12) || 12) + ':' + (em < 10 ? '0' : '') + em + ' ' + (eh >= 12 ? 'PM' : 'AM');
    }
    function slotsOf(d) {
      if (blocked[d]) return [];
      var s = [];
      if (dow(d) === 5) s.push({ t: '9:00 AM', b: booked[d] || 0, kind: 'Every Saturday' });
      if (oneOff[d]) s.push({ t: oneOff[d], b: 0, kind: 'One-off' });
      if (extra[d] && !(dow(d) === 5 && extra[d] === '9:00 AM') && oneOff[d] !== extra[d]) s.push({ t: extra[d], b: 0, cap: added.cap, kind: (added.type === 'rec' ? 'Every ' + ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][dow(d)] : 'One-off') + ' · new' });
      return s;
    }
    function grid() {
      var h = '<span aria-hidden="true"></span>';
      for (var d = 1; d <= 31; d++) {
        var c = [], s = slotsOf(d);
        if (d < TODAY) c.push('past'); if (d === TODAY) c.push('today'); if (d === sel) c.push('sel'); if (blocked[d]) c.push('blocked');
        /* 27 Nov: a small fill bar per bookable day (how full it is) instead of coloured dots */
        var dots = d < TODAY || !s.length ? '' : '<i class="hc-fill"><b style="width:' + Math.round(Math.max.apply(null, s.map(function (x) { return x.b / (x.cap || CAP); })) * 100) + '%"></b></i>';
        h += '<button class="' + c.join(' ') + '" data-d="' + d + '" aria-label="' + DOW[dow(d)] + ' ' + d + ' December' + (blocked[d] ? ', blocked' : s.length ? ', ' + s.length + ' slot' : '') + '"><span class="n">' + d + '</span><span style="display:flex;gap:3px">' + dots + '</span></button>';
      }
      document.getElementById('grid').innerHTML = h;
    }
    function day() {
      var s = slotsOf(sel);
      document.getElementById('dayTitle').textContent = sel === TODAY ? 'Today' : 'Selected day';
      document.getElementById('block').setAttribute('aria-checked', blocked[sel] ? 'true' : 'false');
      /* 27 Nov: the selected day's slot is the same dark tile as Today */
      var soon = sel - TODAY;
      document.getElementById('slots').innerHTML = s.length ? s.map(function (x) {
        var cap = x.cap || CAP, full = x.b >= cap;
        return '<div class="hc-tile" role="button" tabindex="0" data-slot="' + x.t + '"><i class="ph ph-caret-right chev" aria-hidden="true"></i>' +
          '<span class="w">' + (soon > 0 && soon < 8 ? '<b>In ' + soon + ' days</b> · ' : '') + DOW[dow(sel)] + ', ' + sel + ' Dec · ' + x.kind + '</span>' +
          '<span class="tt">' + x.t + ' – ' + end(x.t) + '</span>' +
          '<span class="cp"><span class="b"><i style="width:' + Math.round(x.b / cap * 100) + '%"></i></span>' + (full ? 'Full · closed' : x.b ? x.b + ' of ' + cap + ' booked' : 'No bookings yet') + '</span>' +
          (sel === 5 ? '<span class="al">3 bookings · <em>1 allergy</em></span>' : '') + '</div>';
      }).join('') : blocked[sel] ? '<p class="hc-none">Blocked. Guests can\'t book this day.</p>'
        : sel < TODAY ? '<p class="hc-none">No class.</p>' : '<p class="hc-none">No class. <a href="h-slot.html" data-go="h-slot">Add a slot</a></p>';
    }
    document.getElementById('grid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-d]'); if (!b) return; sel = +b.getAttribute('data-d'); grid(); day();
      if (window.ProtoEmbed) ProtoEmbed.report('h-calendar', [['Selected', DOW[dow(sel)] + ', ' + sel + ' Dec'], ['Capacity', '8 per class']]);
    });
    document.getElementById('slots').addEventListener('click', function (e) {
      var r = e.target.closest('[data-slot]'); if (!r) return;
      if (sel === 5) L.go('h-booking'); else L.toast('No bookings yet', 'ph-users');
    });
    document.getElementById('block').addEventListener('change', function () {
      var el = this, on = el.getAttribute('aria-checked') === 'true';
      if (on && slotsOf(sel).some(function (x) { return x.b > 0; })) { el.setAttribute('aria-checked', 'false'); L.toast('This day has bookings. Cancel the class first.', 'ph-warning'); return; }
      if (on) blocked[sel] = 1; else delete blocked[sel];
      grid(); day(); L.toast(on ? 'Date blocked' : 'Date reopened');
    });
    grid(); day();
  })();
  </script>
  <script>
  (function () { /* compact title appears once the large title scrolls away */
var bar = document.querySelector('.lt-bar'), h = document.querySelector('.lt h1');
function f() { bar.classList.toggle('on', h.getBoundingClientRect().bottom < bar.offsetHeight); }
addEventListener('scroll', f, { passive: true }); f();
  })();
  </script>

  <script>if (window.ProtoEmbed) ProtoEmbed.report('h-calendar', [["Recurring", "Saturdays 9:00 AM"], ["One-off", "Sun 20 Dec"], ["Blocked", "Sat 26 Dec"], ["Capacity", "8 per class · full slots close"]]);</script>
  <script src="../js/shared/credits-data.js?v=0.46.2"></script>
  <script src="../js/shared/credits-badge.js?v=0.46.2"></script>
</body>
</html>
