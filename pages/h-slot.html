<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lokali Host · Add time slot</title>
  <script src="../shell.config.js?v=0.46.5"></script>
  <script src="../js/shared/lock-guard.js?v=0.46.5"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../css/lokali.css?v=0.46.5">
  <link rel="stylesheet" href="../css/host.css?v=0.46.5">
  <script src="../js/lokali.js?v=0.46.5"></script>
  <script src="../js/art.js?v=0.46.5"></script>
  <script src="../js/data.js?v=0.46.5"></script>
<style>
/* Add time slot in Airy (2 Dec): pills for Repeats weekly / One date, day pills, time, guests per slot, one docked Save. */
.hs { padding: 16px 24px calc(var(--home, 0px) + 120px); }
.hs-pills { display: flex; gap: 8px; }
.hs-pills button, .hs-days button { min-height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: 500 13px/1 var(--font); color: var(--ink); cursor: pointer; position: relative; }
.hs-pills button::after, .hs-days button::after { content: ""; position: absolute; inset: -4px 0; }
.hs-pills button.active, .hs-days button.active { background: var(--ink); border-color: var(--ink); color: #fff; }
.hs-days { display: flex; gap: 6px; }
.hs-days button { flex: 1; min-width: 0; padding: 0; }
.hs-sec { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px; }
.hs-sec:first-of-type { border-top: 0; padding-top: 0; }
.hs .label, .hs .field > label { font-size: 15px; line-height: 21px; font-weight: 600; }
.hs .input, .hs .select { min-height: 48px; border-radius: 12px; }
.hs-hint { font-size: 13px; line-height: 18px; color: var(--muted); }
.hs-rec:not([hidden]) { display: flex; flex-direction: column; gap: 20px; }
.hs-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.hs-2 .input { min-width: 0; width: 100%; padding: 12px; }
.hs-cap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hs-cap b { display: block; font-size: 15px; line-height: 21px; font-weight: 600; }
.hs-cap small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
.hs .stepper button { width: 36px; height: 36px; position: relative; }
.hs .stepper button::after { content: ""; position: absolute; inset: -4px; }
.hs-sum { font-size: 15px; line-height: 22px; color: var(--text); }
.hs-sum b { color: var(--ink); }
body.m .cta-bar .btn--primary { flex: 1; border-radius: 999px; }
</style>
<style>
  .hs-h { font-size: 18px; line-height: 24px; font-weight: 700; margin-bottom: 12px; }
  .hs-exp { display: flex; flex-direction: column; gap: 10px; }
  .hs-x { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 14px 10px 10px; border: 1px solid var(--line); border-radius: 20px; background: #fff; text-align: left; color: var(--ink); font: inherit; cursor: pointer; }
  .hs-x.on { border: 2px solid var(--ink); padding: 9px 13px 9px 9px; }
  .hs-x img, .hs-ph { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; flex: none; }
  .hs-ph { display: grid; place-items: center; background: #F7F7F7; color: var(--muted); font-size: 20px; }
  .hs-x > span:not(.hs-ph) { flex: 1; min-width: 0; } .hs-x b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; } .hs-x small { display: block; font-size: 12px; line-height: 17px; color: var(--muted); }
  .hs-x .ph-check-circle { font-size: 22px; color: var(--ink); }
  .hs-x:disabled { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body class="m">
<header class="appbar bordered">
  <button class="icon-btn" data-go="h-calendar" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
  <h1 class="appbar__title">Add time slot</h1>
  <span class="spacer"></span>
</header>

<main class="hs">
  <!-- which experience the slots are for (27 Nov): live listings can take slots; a draft can't until it is published -->
  <section class="hs-sec hs-for" aria-labelledby="for-h">
    <h2 id="for-h" class="hs-h">For</h2>
    <div class="hs-exp" role="radiogroup" aria-labelledby="for-h">
      <button class="hs-x on" role="radio" aria-checked="true"><img data-img="1643188626775-05290d1b6acb" data-w="120" alt=""><span><b>Forest-edge farm walk &amp; kuih morning</b><small>Live · 2.5 hours · up to 8 guests</small></span><i class="ph-fill ph-check-circle" aria-hidden="true"></i></button>
      <button class="hs-x" role="radio" aria-checked="false" disabled><span class="hs-ph"><i class="ph ph-image" aria-hidden="true"></i></span><span><b>Pandan dye workshop</b><small>Draft · publish it to add slots</small></span></button>
    </div>
  </section>
  <section class="hs-sec">
    <div class="hs-pills" data-group id="mode">
      <button class="active" data-panel="#rec" data-value="rec">Repeats weekly</button>
      <button data-panel="#one" data-value="one">One date</button>
    </div>

    <div id="rec" class="hs-rec">
      <div class="field"><span class="label">On</span>
        <div class="hs-days" data-group data-multi id="days" aria-label="Days of the week">
          <button aria-pressed="false" data-dow="0">Mon</button><button aria-pressed="false" data-dow="1">Tue</button><button aria-pressed="false" data-dow="2">Wed</button><button aria-pressed="false" data-dow="3">Thu</button><button aria-pressed="false" data-dow="4">Fri</button><button aria-pressed="false" data-dow="5" disabled title="Already every Saturday" style="opacity:.4">Sat</button><button class="active" aria-pressed="true" data-dow="6">Sun</button>
        </div>
        <span class="hs-hint">Saturdays already repeat at 9:00 AM.</span>
      </div>
      <div class="hs-2">
        <div class="field"><label for="f1">From</label><input class="input" id="f1" type="date" value="2026-12-06"></div>
        <div class="field"><label for="u1">Until</label><input class="input" id="u1" type="date" value="2027-02-28"></div>
      </div>
    </div>

    <div id="one" hidden>
      <div class="field"><label for="od">Date</label><input class="input" id="od" type="date" value="2026-12-24"></div>
    </div>

    <div class="field"><label for="t1">Start time</label><select class="select" id="t1"><option>8:00 AM</option><option selected>9:00 AM</option><option>2:00 PM</option></select>
      <span class="hs-hint" id="endHint">Ends 11:30 AM · 2.5 hours, from your listing</span></div>
  </section>

  <section class="hs-sec">
    <div class="hs-cap"><div><b>Guests per slot</b><small>Closes to new bookings when full</small></div>
      <div class="stepper" data-stepper data-min="2" data-max="8"><button data-dec aria-label="Fewer guests"><i class="ph ph-minus" aria-hidden="true"></i></button><output>8</output><button data-inc aria-label="More guests"><i class="ph ph-plus" aria-hidden="true"></i></button></div>
    </div>
  </section>

  <section class="hs-sec">
    <p class="hs-sum" id="sum"></p>
  </section>
</main>

<div class="cta-bar"><button class="btn btn--primary" id="save">Save slots</button></div>

  <script>
  (function () {
    var mode = 'rec', DAYN = ['Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays', 'Sundays'];
    function q(id) { return document.getElementById(id); }
    function days() { return [].map.call(document.querySelectorAll('#days button.active'), function (b) { return +b.getAttribute('data-dow'); }); }
    function count(ds) { /* slots between From and Until on the chosen weekdays; blocked dates (Sat 26 Dec) skipped */
      var a = new Date(q('f1').value + 'T00:00'), b = new Date(q('u1').value + 'T00:00'), n = 0;
      if (isNaN(a) || isNaN(b)) return 0;
      for (var d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) { var w = (d.getDay() + 6) % 7; if (ds.indexOf(w) > -1 && !(d.getMonth() === 11 && d.getDate() === 26)) n++; }
      return n;
    }
    var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    function fmt(v, wd) { var d = new Date(v + 'T00:00'); return isNaN(d) ? '' : (wd ? WD[d.getDay()] + ', ' : '') + d.getDate() + ' ' + MO[d.getMonth()] + ' ' + d.getFullYear(); }
    function end(t) { var m = t.match(/(\d+):(\d+) (AM|PM)/), h = (+m[1] % 12) + (m[3] === 'PM' ? 12 : 0), mins = h * 60 + +m[2] + 150, eh = Math.floor(mins / 60), em = mins % 60; return ((eh % 12) || 12) + ':' + (em < 10 ? '0' : '') + em + ' ' + (eh >= 12 ? 'PM' : 'AM'); }
    function n() { return mode === 'one' ? 1 : count(days()); }
    function sum() {
      var t = q('t1').value, cap = document.querySelector('[data-stepper] output').textContent, k = n();
      q('endHint').textContent = 'Ends ' + end(t) + ' · 2.5 hours, from your listing';
      q('sum').innerHTML = mode === 'one'
        ? 'Adds <b>1 slot</b> on ' + fmt(q('od').value, true) + ' at ' + t + ', up to ' + cap + ' guests.'
        : (days().length ? 'Adds <b>' + k + (k === 1 ? ' slot' : ' slots') + '</b>, ' + days().map(function (d) { return DAYN[d]; }).join(' and ') + ' at ' + t + ', ' + fmt(q('f1').value) + ' – ' + fmt(q('u1').value) + ', up to ' + cap + ' guests. Blocked dates are skipped.' : 'Choose at least one day.');
      q('save').textContent = k === 1 ? 'Save slot' : 'Save slots';
      q('save').disabled = mode === 'rec' && !days().length;
    }
    q('mode').addEventListener('pick', function (e) { mode = e.detail === 'one' ? 'one' : 'rec'; sum(); });
    document.addEventListener('click', function () { setTimeout(sum, 0); });
    ['f1', 'u1', 'od', 't1'].forEach(function (id) { q(id).addEventListener('change', sum); });
    q('save').addEventListener('click', function () {
      var t = q('t1').value, cap = +document.querySelector('[data-stepper] output').textContent, od = new Date(q('od').value + 'T00:00');
      L.state.set('hSlotAdded', mode === 'one'
        ? { type: 'one', n: 1, t: t, cap: cap, d: (od.getFullYear() === 2026 && od.getMonth() === 11) ? od.getDate() : 0 }
        : { type: 'rec', n: n(), t: t, cap: cap, days: days() });
      L.go('h-calendar');
    });
    sum();
  })();
  </script>
  <script src="../js/shared/embed.js?v=0.46.5"></script>
  <script>if (window.ProtoEmbed) ProtoEmbed.report('h-slot', [["Type", "Repeats weekly or one date"], ["Duration", "2.5 hours (from listing)"], ["Capacity", "Up to 8 · closes when full"]]);</script>
  <script src="../js/shared/credits-data.js?v=0.46.5"></script>
  <script src="../js/shared/credits-badge.js?v=0.46.5"></script>
</body>
</html>
