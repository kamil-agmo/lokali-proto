<style>
/* Host Inbox in Airy (2 Dec), same pattern as the guest Inbox: one list, newest first, each thread says what it is about
   in a plain status line (booking date and group, or enquiry). No filters or badges: 4 threads need none.
   One listing only, so the listing thumbnail and title per row were cut (they said the same thing four times). */
.thread { display: flex; gap: 12px; align-items: flex-start; padding: 16px 24px !important; color: var(--ink); cursor: pointer; text-decoration: none; }
.thread + .thread { border-top: 1px solid var(--line); }
.thread .av { flex: none; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: var(--sand); color: var(--ink); font-size: 15px; font-weight: 600; }
.thread .body { flex: 1; min-width: 0; }
.thread .top { display: flex; justify-content: space-between; gap: 8px; }
.thread .top b { font-size: 15px; line-height: 21px; font-weight: 600; }
.thread .top time { flex: none; font-size: 12px; line-height: 21px; color: var(--muted); }
.thread.unread .top time { color: var(--ink); font-weight: 600; }
.thread .prev { display: block; font-size: 15px; line-height: 21px; margin-top: 2px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread.unread .prev { color: var(--ink); font-weight: 600; }
.thread .st { display: block; margin-top: 6px; font-size: 12px; line-height: 17px; color: var(--muted); }
.thread .st--up { color: var(--ink); font-weight: 600; }
.udot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); flex: none; margin-top: 6px; }
/* guest-mode messages: one plain line, like the guest Inbox's note */
.mode-note { margin: 4px 24px 8px !important; }
.mode-note i { color: var(--muted) !important; }
.mode-note b { color: var(--ink) !important; }
.ib-in { animation: ibIn .25s var(--ease); } @keyframes ibIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ib-in { animation: none; } }
</style>
</head>
<body class="m">
<div class="lt-bar" aria-hidden="true">Inbox</div>
<header class="lt"><h1>Inbox</h1></header>
<a class="mode-note" href="g-inbox.html" data-switch="guest" data-switch-to="g-inbox"><i class="ph ph-suitcase-rolling" aria-hidden="true"></i><span class="grow" id="gNote">Messages about your own trips</span><b>Switch</b></a>
<main id="threads" style="padding-bottom:calc(var(--home, 0px) + 110px)"></main>

<nav class="tabbar" data-tabs="host" data-active="h-inbox"></nav>
  <script>
  (function () {
/* [thread key, name, photo id or initials, last message, time, booked?, status line] — newest first. Prototype "today" = Wed 2 Dec. */
var T = [
  ['aisyah', 'Nur Aisyah Kamal', L.people.aisyah.img, 'Irfan is allergic to peanuts. Is any of the kuih made with peanuts?', '9:12 AM', true, 'Booked · Sat, 5 Dec · 3 guests'],
  ['hafiz', 'Hafiz Ismail', 'HI', 'You: Yes, all three kuih are vegetarian. See you Saturday!', '8:41 AM', true, 'Booked · Sat, 5 Dec · 1 guest'],
  ['priya', 'Priya Nair', 'PN', 'You: Yes, along Jalan SS 3/37, right by the garden gate.', 'Tue', true, 'Booked · Sat, 5 Dec · 2 guests'],
  ['farah', 'Farah Hanim', 'FH', 'You: Yes, every Saturday at 9:00 AM, and 12 Dec is open.', 'Mon', false, 'Enquiry · not booked']
];
var read = []; try { read = JSON.parse(sessionStorage.getItem('lk-h-read') || '[]'); } catch (e) {}
function unread(k) { return k === 'aisyah' && read.indexOf(k) < 0; }   /* matches the tab bar's 1 */
function row(t) {
  var av = t[2].length > 3 ? '<img class="av" src="' + L.img(t[2], 120) + '" alt="">' : '<span class="av" aria-hidden="true">' + t[2] + '</span>';
  return '<a class="thread' + (unread(t[0]) ? ' unread' : '') + '" href="h-chat.html" data-go="h-chat" data-thread="' + t[0] + '">' + av +
    '<span class="body"><span class="top"><b>' + t[1] + '</b><time>' + t[4] + '</time></span><span class="prev">' + t[3] + '</span><span class="st' + (t[5] ? ' st--up' : '') + '">' + t[6] + '</span></span>' +
    (unread(t[0]) ? '<span class="udot" aria-label="Unread"></span>' : '') + '</a>';
}
var m = document.getElementById('threads'); m.innerHTML = T.map(row).join(''); m.classList.add('ib-in');
m.addEventListener('click', function (e) { var a = e.target.closest('[data-thread]'); if (a) try { sessionStorage.setItem('lk-h-thread', a.dataset.thread); } catch (x) {} }, true);
/* her guest-mode inbox: say how many unread wait there, from the guest read-state */
var g = L.unread ? L.unread() : 0; if (g) document.getElementById('gNote').textContent = 'Your own trips · ' + g + ' unread';
  })();
  </script>
  <script>
  (function () { /* compact title appears once the large title scrolls away */
var bar = document.querySelector('.lt-bar'), h = document.querySelector('.lt h1');
function f() { bar.classList.toggle('on', h.getBoundingClientRect().bottom < bar.offsetHeight); }
addEventListener('scroll', f, { passive: true }); f();
  })();
  </script>
