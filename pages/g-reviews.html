<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lokali · Reviews</title>
  <script src="../shell.config.js?v=0.46.5"></script>
  <script src="../js/shared/lock-guard.js?v=0.46.5"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../css/lokali.css?v=0.46.5">
  <link rel="stylesheet" href="../css/guest.css?v=0.46.5">
  <script src="../js/lokali.js?v=0.46.5"></script>
  <script src="../js/art.js?v=0.46.5"></script>
  <script src="../js/data.js?v=0.46.5"></script>
  <style>
    .rs { padding: 8px 24px 16px; }
    .rs-score b { display: block; font: 600 34px/41px var(--font-display); color: var(--ink); }
    .rs-score .stars { display: flex; gap: 2px; color: var(--star); font-size: 14px; margin-top: 2px; }
    .rs-score small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 4px; }
    .rv-tools { padding: 0 24px 8px; }
    /* Airy (27 Nov): Home-style pills like My bookings; sort is one choice, With photos a toggle after a thin divider */
    .rv-pills { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -24px; padding: 0 24px; }
    .rv-pills::-webkit-scrollbar { display: none; }
    .rv-sort, #filt { display: flex; gap: 8px; }
    .rv-pills button { flex: none; min-height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: 500 13px/1 var(--font); color: var(--ink); cursor: pointer; }
    .rv-pills button.active, .rv-pills button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .rv-div { flex: none; width: 1px; height: 20px; background: var(--line); }
    .rvl { padding: 0 24px 32px; }
    .rvi { padding: 16px 0; border-top: 1px solid var(--line); }
    .rvi-head { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
    .rvi-head img, .rvi-head .ini { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .rvi-head .ini { display: grid; place-items: center; background: var(--primary-tint); color: var(--primary); font-weight: 600; font-size: 15px; }
    .rvi-head b { display: block; font-size: 15px; line-height: 22px; font-weight: 600; } .rvi-head small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
    .rvi-stars { display: flex; gap: 2px; color: var(--star); font-size: 13px; }
    .rvi p { margin-top: 10px; font-size: 15px; line-height: 22px; }
    .rvi-photos { display: flex; gap: 8px; margin-top: 10px; } .rvi-photos img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; }
    .rvi-reply { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); font-size: 15px; line-height: 20px; }
    .rvi-reply b { display: block; font-size: 13px; line-height: 18px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
    .rv-empty { padding: 32px 0; text-align: center; color: var(--muted); }
    .rv-more { width: 100%; margin-top: 8px; }
  </style>
</head>
<body class="m">
<header class="appbar appbar--flow">
  <button class="icon-btn" data-go="g-listing" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
  <h1 class="appbar__title">Reviews</h1>
  <span class="spacer"></span>
</header>

<section class="rs" aria-label="Rating summary">
  <div class="rs-score"><b>4.96</b><span class="stars" aria-label="4.96 out of 5"><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i></span><small>128 reviews</small></div>
</section>

<div class="rv-tools">
  <div class="rv-pills"><div class="rv-sort" id="sort" role="tablist" aria-label="Sort reviews"><button class="active" role="tab" aria-selected="true" data-s="new">Newest</button><button role="tab" aria-selected="false" data-s="high">Highest</button><button role="tab" aria-selected="false" data-s="low">Lowest</button></div><span class="rv-div" aria-hidden="true"></span><div id="filt"><button aria-pressed="false" data-f="photos">With photos</button></div></div>
</div>

<main class="rvl" id="list" aria-live="polite"></main>

<script>
(function () {
  var R = [
    { n: 'Daniel', from: 'Ipoh', when: 'Nov 2026', d: 30, s: 5, t: 'Silent paddling under thousands of blinking lights. My kids still talk about it. Pak Rahim\'s wife\'s kuih were the best we had in Malaysia.', img: '1701980889802-55ff39e2e973', photos: ['1784751449882-c2c28ca2dd78', '1646513378626-23493fccf7c9'], kids: true, reply: 'Terima kasih Daniel! Come back in the dry season, the fireflies are even brighter.' },
    { n: 'Hidayah', from: 'Johor Bahru', when: 'Nov 2026', d: 25, s: 5, t: 'A silent paddle, no engine, just the water and the fireflies. Unforgettable.' },
    { n: 'Wei Ming', from: 'Penang', when: 'Nov 2026', d: 20, s: 5, t: 'Easy for our parents too. Life jackets for everyone and a calm boat.', kids: true },
    { n: 'Ahmad Faiz', from: 'Kuala Lumpur', when: 'Oct 2026', d: 18, s: 4, t: 'Beautiful night. I only wish we had more time with the fireflies.', reply: 'Thank you Ahmad! On quiet nights we now stay 15 minutes longer.' },
    { n: 'Mei Xin', from: 'Klang', when: 'Oct 2026', d: 15, s: 5, t: 'Pak Rahim knows every bend of the river. The kuih at his home was a lovely start.', photos: ['1786717667687-2f05e422d6f9'] },
    { n: 'Chong Li Ying', from: 'Melaka', when: 'Sep 2026', d: 10, s: 5, t: 'Booked for a birthday. Worth every ringgit, and good to know where the money goes.', reply: 'Selamat hari jadi, Li Ying! Thank you for coming.' },
    { n: 'Marcus', from: 'Kuching', when: 'Aug 2026', d: 6, s: 3, t: 'Lovely host. It rained on our night so we saw fewer fireflies, but he warned us the day before.', reply: 'Sorry about the rain, Marcus. Message me anytime to rebook for free.' },
    { n: 'Hana', from: 'Kuantan', when: 'Aug 2026', d: 4, s: 5, t: 'Quiet, respectful and magical. Thank you for protecting this place.', photos: ['1773904594755-6c25ab2ef6c9'] }
  ];
  var sort = 'new', f = {}, shown = 6;
  function stars(s) { var h = ''; for (var k = 0; k < 5; k++) h += '<i class="' + (k < s ? 'ph-fill' : 'ph') + ' ph-star" aria-hidden="true"></i>'; return '<span class="rvi-stars" aria-label="' + s + ' out of 5 stars">' + h + '</span>'; }
  function draw() {
    var list = R.filter(function (r) { return (!f.photos || r.photos); });
    list.sort(function (a, b) { return sort === 'high' ? b.s - a.s || b.d - a.d : sort === 'low' ? a.s - b.s || b.d - a.d : b.d - a.d; });
    var total = list.length, h = list.slice(0, shown).map(function (r) {
      return '<article class="rvi"><div class="rvi-head">' + (r.img ? '<img src="' + L.img(r.img, 100) + '" alt="">' : '<span class="ini" aria-hidden="true">' + r.n[0] + '</span>') + '<div><b>' + r.n + '</b><small>' + r.from + ' · ' + r.when + '</small></div>' + stars(r.s) + '</div>' +
        '<p>' + r.t + '</p>' + (r.photos ? '<div class="rvi-photos">' + r.photos.map(function (p) { return '<img src="' + L.img(p, 200) + '" alt="Guest photo">'; }).join('') + '</div>' : '') +
        (r.reply ? '<div class="rvi-reply"><b>Reply from Pak Rahim</b>' + r.reply + '</div>' : '') + '</article>';
    }).join('');
    if (!total) h = '<p class="rv-empty">No reviews match. <button class="btn btn--sm btn--secondary" id="clr">Clear filters</button></p>';
    else if (total > shown) h += '<button class="btn btn--secondary rv-more" id="more">Show more reviews</button>';
    var m = document.getElementById('list'); m.innerHTML = h;
    var c = document.getElementById('clr'); if (c) c.onclick = function () { f = {}; document.querySelectorAll('#filt button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); draw(); };
    var mo = document.getElementById('more'); if (mo) mo.onclick = function () { shown += 6; draw(); };
  }
  document.getElementById('sort').addEventListener('click', function (e) { var b = e.target.closest('[data-s]'); if (!b) return; this.querySelectorAll('button').forEach(function (x) { var on = x === b; x.classList.toggle('active', on); x.setAttribute('aria-selected', on); }); sort = b.dataset.s; draw(); });
  document.getElementById('filt').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (!b) return; var on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); f[b.dataset.f] = on; draw(); });
  draw();
})();
</script>
  <script src="../js/shared/embed.js?v=0.46.5"></script>
  <script>if (window.ProtoEmbed) ProtoEmbed.report('g-reviews', [['Opens from', 'Experience page › Show all 128 reviews'], ['Sort', 'Newest, highest, lowest'], ['Filter', 'With photos']]);</script>
  <script src="../js/shared/credits-data.js?v=0.46.5"></script>
  <script src="../js/shared/credits-badge.js?v=0.46.5"></script>
</body>
</html>
