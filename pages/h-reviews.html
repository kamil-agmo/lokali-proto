<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../css/lokali.css?v=0.46.3">
  <link rel="stylesheet" href="../css/host.css?v=0.46.3">

<style>
/* Host Reviews in Airy (2 Dec), same look as the guest All reviews page. 3 reviews: no bars, no tabs (all 5 stars, a handful of rows).
   The one without a reply comes first with a small Reply pill; posted replies sit under their review. */
.rs { padding: 8px 24px 16px; }
.rs-score b { display: block; font-size: 30px; line-height: 34px; font-weight: 700; color: var(--ink); }
.rs-score .stars { display: flex; gap: 2px; color: var(--star); font-size: 14px; margin-top: 4px; }
.rs-score small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 4px; }
.rvl { padding: 0 24px calc(var(--home, 0px) + 32px); }
.rvi { padding: 16px 0; border-top: 1px solid var(--line); }
.rvi-head { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; }
.rvi-head img, .rvi-head .ini { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.rvi-head .ini { display: grid; place-items: center; background: var(--sand); color: var(--ink); font-weight: 600; font-size: 15px; }
.rvi-head b { display: block; font-size: 15px; line-height: 22px; font-weight: 600; } .rvi-head small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
.rvi-stars { display: flex; gap: 2px; color: var(--star); font-size: 13px; }
.rvi p { margin-top: 10px; font-size: 15px; line-height: 22px; color: var(--text); }
/* reply hangs under the review (27 Nov, explore/host-pass.html #3): curved connector, her photo, Host reply tag, grey bubble */
.rvi-reply { position: relative; margin: 14px 0 0 20px; }
.rvi-reply::before { content: ""; position: absolute; left: -14px; top: -6px; width: 12px; height: 24px; border-left: 2px solid #DDDDDD; border-bottom: 2px solid #DDDDDD; border-bottom-left-radius: 10px; }
.rvr-hb { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink); }
.rvr-hb img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
.rvr-tag { height: 20px; padding: 0 8px; border-radius: 999px; background: #E8F0EA; color: var(--primary-strong); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
.rvr-bub { margin-top: 6px; padding: 10px 12px; border-radius: 4px 16px 16px 16px; background: #F7F7F7; font-size: 14px; line-height: 20px; color: #3D3D3D; }
.rvi-todo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 13px; line-height: 18px; color: var(--muted); }
.rvi-todo .btn { flex: none; min-height: 32px !important; padding: 0 14px; font-size: 13px; position: relative; }
.rvi-todo .btn::after { content: ""; position: absolute; inset: -6px 0; } /* 44 px tap */
.rvi.is-new { animation: rvIn .3s var(--ease); } @keyframes rvIn { from { opacity: .4; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .rvi.is-new { animation: none; } }
</style>
</head>
<body class="m">
<header class="appbar appbar--flow">
  <button class="icon-btn" data-go="h-menu" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
  <h1 class="appbar__title">Reviews</h1>
  <span class="spacer"></span>
</header>

<section class="rs" aria-label="Rating summary">
  <div class="rs-score"><b>5.0</b><span class="stars" aria-label="5.0 out of 5"><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i><i class="ph-fill ph-star"></i></span><small>3 reviews · Forest-edge farm walk &amp; kuih morning</small></div>
</section>

<main class="rvl" id="list"></main>

<div class="sheet" id="reply" role="dialog" aria-labelledby="replyTitle">
  <h2 class="sheet-title" id="replyTitle">Reply to Daniel</h2>
  <p class="small muted mt1">Your reply shows under the review on your listing.</p>
  <textarea class="textarea mt3" id="replyText" rows="4" aria-label="Your reply">Thank you, Daniel! Your kids were great at picking pandan on the forest edge. Hope to see you all at the next harvest.</textarea>
  <div class="sheet-foot"><button class="btn btn--primary btn--block" id="post">Post reply</button></div>
</div>

<script>
(function () {
  var R = L.hosting.reviews;   /* Daniel Wong (no reply yet), Chloe Lim, Suresh Kumar */
  function stars(n) { var h = ''; for (var k = 0; k < 5; k++) h += '<i class="' + (k < n ? 'ph-fill' : 'ph') + ' ph-star" aria-hidden="true"></i>'; return '<span class="rvi-stars" aria-label="' + n + ' out of 5 stars">' + h + '</span>'; }
  function ini(n) { return n.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2); }
  function item(r, i) {
    var p = r.who && L.people[r.who];
    return '<article class="rvi" id="rv' + i + '"><div class="rvi-head">' + (p ? '<img src="' + L.img(p.img, 96) + '" alt="">' : '<span class="ini" aria-hidden="true">' + ini(r.name) + '</span>') +
      '<div><b>' + r.name + '</b><small>' + r.date.replace('Nov', 'November') + '</small></div>' + stars(r.stars) + '</div><p>' + r.text + '</p>' +
      (r.reply ? '<div class="rvi-reply">' + '<div class="rvr-hb"><img src="' + L.img('1545266241-3516e2a6e016', 60) + '" alt="">Aina<span class="rvr-tag">Host reply</span></div>' + '<div class="rvr-bub">' + r.reply + '</div></div>'
               : '<div class="rvi-todo"><span>No reply yet</span><button class="btn btn--primary btn--sm" data-open="#reply" data-i="' + i + '">Reply</button></div>') + '</article>';
  }
  var order = R.map(function (r, i) { return i; }).sort(function (a, b) { return (R[a].reply ? 1 : 0) - (R[b].reply ? 1 : 0); });
  var list = document.getElementById('list');
  list.innerHTML = order.map(function (i) { return item(R[i], i); }).join('');
  var cur = 0;
  list.addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (!b) return; cur = +b.getAttribute('data-i'); document.getElementById('replyTitle').textContent = 'Reply to ' + R[cur].name.split(' ')[0]; }, true);
  document.getElementById('post').addEventListener('click', function () {
    var t = document.getElementById('replyText').value.trim(); if (!t) return;
    var box = document.querySelector('#rv' + cur + ' .rvi-todo'), r = document.createElement('div');
    r.className = 'rvi-reply'; r.innerHTML = '<div class="rvr-hb"><img src="' + L.img('1545266241-3516e2a6e016', 60) + '" alt="">Aina<span class="rvr-tag">Host reply</span></div>' + '<div class="rvr-bub"></div>'; r.querySelector('.rvr-bub').appendChild(document.createTextNode(t));
    if (box) box.replaceWith(r); document.getElementById('rv' + cur).classList.add('is-new');
    L.close(); L.toast('Reply posted');
  });
})();
</script>
  <script src="../js/shared/embed.js?v=0.46.3"></script>
  <script>if (window.ProtoEmbed) ProtoEmbed.report('h-reviews', [["Rating", "5.0 · 3 reviews"], ["Needs a reply", "1 · Daniel Wong"], ["Replied", "Chloe Lim, Suresh Kumar"]]);</script>

</body>
</html>
