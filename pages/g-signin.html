<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lokali · Sign in</title>
  <script src="../shell.config.js?v=0.46.5"></script>
  <script src="../js/shared/lock-guard.js?v=0.46.5"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../css/lokali.css?v=0.46.5">
  <link rel="stylesheet" href="../css/guest.css?v=0.46.5">
  <script src="../js/lokali.js?v=0.46.5"></script>
  <script src="../js/art.js?v=0.46.5"></script>
  <script src="../js/data.js?v=0.46.5"></script>
<style>
/* the switch between Sign in and Create account sits with the main button in the docked bar (27 Nov) */
.sw-bar { min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 4px; margin: 0; }
</style>
</head>
<body class="m has-cta">
<header class="appbar appbar--flow">
  <button class="icon-btn" data-go="g-book" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
  <span class="grow"></span>
</header>
<main class="pad stack-lg" style="padding-top:8px;padding-bottom:32px">
  <div class="stack" style="gap:8px">
    <span class="wordmark" style="font-size:15px"><i class="ph-fill ph-leaf" aria-hidden="true"></i>lokali</span>
    <h1 class="t1" id="h">Sign in to book</h1>
    <p class="sum-note" style="margin-top:0">Your spot on <b style="color:var(--ink)">Sun, 6 Dec · 5:00 PM</b> is held for 10 minutes.</p>
  </div>
  <div class="stack">
    <button class="btn-social apple" data-go="g-checkout" onclick="L.state.set('signedIn', true)"><i class="ph-fill ph-apple-logo" aria-hidden="true"></i>Continue with Apple</button>
    <button class="btn-social" data-go="g-checkout" onclick="L.state.set('signedIn', true)"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" style="flex:none"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
  </div>
  <div class="or">or use email</div>
  <form class="form-sec" id="f" novalidate>
    <div class="field" id="namef" hidden><label for="nm">Full name</label><input class="input" id="nm" autocomplete="name" placeholder="As on your ID"></div>
    <div class="field"><label for="em">Email</label><input class="input" id="em" type="email" value="aina.rahman@gmail.com" autocomplete="email"></div>
    <div class="field"><label for="pw">Password</label><div class="input-wrap"><input class="input" id="pw" type="password" value="••••••••••" style="padding-left:16px;padding-right:48px" autocomplete="current-password"><button type="button" class="icon-btn" style="position:absolute;right:4px;top:5px" aria-label="Show password"><i class="ph ph-eye" aria-hidden="true" style="position:static;transform:none"></i></button></div>
      <a href="#" class="small strong" data-toast="Reset link sent to aina.rahman@gmail.com" data-toast-icon="ph-envelope">Forgot password?</a></div>
    <div class="cta-bar cta-stack"><button class="btn btn--primary btn--block" type="submit" id="sub">Sign in</button><p class="center small sw-bar" id="sw">New to Lokali? <a href="#" id="toggle" class="strong">Create an account</a></p></div>
  </form>
  <p class="xs muted center">By continuing you agree to Lokali's Terms and Privacy Notice. We handle your data under Malaysia's Personal Data Protection Act (PDPA).</p>
</main>
  <script>
  (function () {
var signup = false;
document.getElementById('sw').addEventListener('click', function (e) {
  if (!e.target.closest('a')) return; e.preventDefault(); signup = !signup;
  document.getElementById('namef').hidden = !signup;
  document.getElementById('h').textContent = signup ? 'Create your account' : 'Sign in to book';
  document.getElementById('sub').textContent = signup ? 'Create account' : 'Sign in';
  this.innerHTML = signup ? 'Already have an account? <a href="#" class="strong">Sign in</a>' : 'New to Lokali? <a href="#" class="strong">Create an account</a>';
});
document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); L.state.set('signedIn', true); L.go('g-checkout'); });
  })();
  </script>
  <script>L.swapExp();</script>
  <script src="../js/shared/embed.js?v=0.46.5"></script>
  <script>if (window.ProtoEmbed) ProtoEmbed.report('g-signin', [['When shown', 'Only at booking, not while browsing'], ['Methods', 'Apple, Google, email']]);</script>
  <script src="../js/shared/credits-data.js?v=0.46.5"></script>
  <script src="../js/shared/credits-badge.js?v=0.46.5"></script>
</body>
</html>
