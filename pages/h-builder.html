<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lokali Host · Listing builder</title>
  <script src="../shell.config.js?v=0.35.2"></script>
  <script src="../js/shared/lock-guard.js?v=0.35.2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="../css/lokali.css?v=0.35.2">
  <link rel="stylesheet" href="../css/host.css?v=0.35.2">
  <script src="../js/lokali.js?v=0.35.2"></script>
  <script src="../js/art.js?v=0.35.2"></script>
  <script src="../js/data.js?v=0.35.2"></script>
</head>
<body class="m">
  <header class="appbar appbar--flow has-prog">
    <button class="icon-btn" data-go="h-listings" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
    <span class="appbar__title step-label">Edit listing · <span id="pct">8 of 13</span></span>
    <button class="btn btn--ghost btn--sm" data-go="g-listing"><i class="ph ph-eye" aria-hidden="true"></i>Preview</button>
    <div class="flow-prog" aria-hidden="true"><i id="bar" style="width:60%"></i></div>
  </header>
  <section class="pad" style="padding-top:16px;padding-bottom:16px">
    <h1 class="t2">Kelip-kelip photography night</h1>
    <p class="sum-note" id="left">5 required sections left · draft saved</p>
  </section>
  <div id="groups"></div>
  <p class="xs faint center mt3"><button class="btn btn--ghost btn--sm" id="demo">Prototype: complete all required sections</button></p>
  <div style="height:16px"></div>
  <div class="cta-bar">
    <button class="btn btn--secondary" data-toast="Draft saved" data-toast-icon="ph-floppy-disk">Save draft</button>
    <button class="btn btn--primary grow" id="submit" disabled>Submit for review</button>
  </div>

  <script>
  (function () {
    // [n, name, required(1)/optional(0)/if-food(2), done, summary, target]
    var G = [
      ['Is it appealing?', [
        [1, 'Hook', 1, 1, 'Title, promise, 6 photos'],
        [2, 'Quick facts', 1, 1, '3 h · 2–6 guests · English, Malay'],
        [3, 'Story', 1, 1, '142 / 200 words'],
        [4, 'Itinerary', 1, 1, '5 steps, 7:30 – 10:30 PM']]],
      ['Is it worth it?', [
        [5, 'Included / not included', 1, 1, '4 included · 2 not included'],
        [6, 'Meet your guide', 1, 0, 'Missing: 4 personal prompts', 'h-step-guide']]],
      ['Is it truly sustainable?', [
        [7, 'Impact story', 1, 0, 'Missing: why it is sustainable'],
        [8, 'Where your money goes', 1, 0, 'Missing: price split (must add to 100%)']]],
      ['What do I need to know?', [
        [9, 'Getting there', 1, 1, 'Jeti Kampung Kuantan · address after booking'],
        [10, 'What to bring and wear', 1, 1, '5 items'],
        [11, 'Respect and etiquette', 0, 0, 'Optional · recommended for nature trips'],
        [12, 'Food and dietary', 2, 1, 'Halal snacks · vegetarian on request'],
        [13, 'Accessibility', 1, 0, 'Missing: pick-list + notes']]],
      ['Price & booking', [
        [14, 'Price & cancellation policy', 1, 0, 'Missing: price per person', 'h-step-price'],
        [15, 'Group, private & corporate', 0, 0, 'Optional · private boat, corporate link'],
        [16, 'FAQs', 0, 0, 'Optional']]]
    ];
    function render() {
      var req = 0, done = 0, h = '';
      G.forEach(function (g) {
        h += '<div class="sec-group"><h2 class="is-h4">' + g[0] + '</h2></div><div class="list" style="margin:0 var(--s4)">';
        g[1].forEach(function (s) {
          var r = s[2] > 0; if (r) { req++; if (s[3]) done++; }
          var st = s[3] ? '<span class="st done"><i class="ph ph-check" aria-hidden="true"></i></span>' : r ? '<span class="st todo"><i class="ph ph-exclamation-mark" aria-hidden="true"></i></span>' : '<span class="st opt"><i class="ph ph-plus" aria-hidden="true"></i></span>';
          var tag = s[2] === 1 ? '' : s[2] === 2 ? ' <span class="badge" style="padding:0 8px">If food is served</span>' : ' <span class="badge" style="padding:0 8px">Optional</span>';
          h += '<div class="sec" data-t="' + (s[5] || '') + '"><span class="sec__n">' + s[0] + '</span>' + st + '<div class="grow"><b>' + s[1] + '</b>' + tag + '<p class="small ' + (!s[3] && r ? '' : 'muted') + '" style="' + (!s[3] && r ? 'color:var(--warn)' : '') + '">' + (s[3] && !r ? 'Added' : s[4]) + '</p></div><i class="ph ph-caret-right faint" aria-hidden="true"></i></div>';
        });
        h += '</div>';
      });
      document.getElementById('groups').innerHTML = h;
      var left = req - done;
      document.getElementById('bar').style.width = Math.floor(done / req * 20) * 5 + '%';
      document.getElementById('pct').textContent = done + ' of ' + req;
      document.getElementById('left').textContent = left ? left + ' required sections left · draft saved' : 'All required sections done';
      document.getElementById('submit').disabled = left > 0;
      if (window.ProtoEmbed) ProtoEmbed.report('h-builder', [['Required done', done + ' of ' + req], ['Submit', left ? 'Disabled' : 'Enabled']]);
    }
    document.getElementById('groups').addEventListener('click', function (e) {
      var s = e.target.closest('.sec'); if (!s) return;
      var t = s.getAttribute('data-t'); if (t) L.go(t); else L.toast('Opens this section, one question at a time', 'ph-pencil-simple');
    });
    document.getElementById('demo').addEventListener('click', function () { G.forEach(function (g) { g[1].forEach(function (s) { if (s[2]) s[3] = 1; }); }); render(); });
    document.getElementById('submit').addEventListener('click', function () { L.toast('Submitted. Lokali will review it in 2–3 working days.'); setTimeout(function () { L.go('h-listings'); }, 900); });
    render();
  })();
  </script>
  <script src="../js/shared/embed.js?v=0.35.2"></script>
  <script>if (window.ProtoEmbed) ProtoEmbed.report('h-builder', [["Listing", "Kelip-kelip photography night"], ["Required done", "8 of 13"], ["Submit", "Disabled"]]);</script>
  <script src="../js/shared/credits-data.js?v=0.35.2"></script>
  <script src="../js/shared/credits-badge.js?v=0.35.2"></script>
</body>
</html>
