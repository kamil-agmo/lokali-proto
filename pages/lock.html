<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1b2b">
  <title>Lokali</title>
  <script src="../shell.config.js?v=0.46.1"></script>
  <link rel="stylesheet" href="../css/pages/lock.css?v=0.46.1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=check_circle,lock,lock_open,visibility,visibility_off">
</head>
<body>
  <main class="lk" id="lk">
    <div class="lk__bg" aria-hidden="true"><span class="lk__glow"></span><span class="lk__grid"></span></div>
    <section class="lk__panel">
      <div class="lk__top">
        <div class="lk__brand"><img class="lk__logo" id="lkLogo" alt="" hidden><b id="brand"></b><span id="tagline-sub"></span></div>
        <div class="lk__tag" id="taglines" aria-live="polite"></div>
      </div>
      <div class="lk__bottom">
        <ul class="lk__stats" id="stats"></ul>
        <form class="lk__form" id="form" autocomplete="off" novalidate>
          <label class="lk__label" for="pw"><span class="mi" style="font-size:16px" aria-hidden="true">lock</span>Prototype password</label>
          <div class="lk__field" id="field">
            <input id="pw" name="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter password" aria-describedby="err">
            <button type="button" class="lk__eye" id="eye" aria-label="Show password"><span class="mi" style="font-size:22px" aria-hidden="true">visibility</span></button>
          </div>
          <p class="lk__err" id="err" role="alert" hidden>That password isn’t right. Try again.</p>
          <button class="lk__go" id="go" type="submit"><span class="mi" style="font-size:20px" aria-hidden="true">lock_open</span>Unlock</button>
        </form>
        <p class="lk__foot" id="foot"></p>
      </div>
    </section>
    <div class="lk__ok" id="ok" aria-hidden="true"><span class="mi" style="font-size:44px">check_circle</span><b>Welcome</b></div>
  </main>
  <script src="../js/shared/embed.js?v=0.46.1"></script>
  <script src="../js/pages/lock.js?v=0.46.1"></script>
</body>
</html>
