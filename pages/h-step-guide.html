<style>
/* Meet your guide in Airy (27 Nov): Aina's photo and name, 4 personal prompts as open fields split by hairlines, an example on each empty one.
   Cut: boxed prompt cards, the header Save (same as the bottom button) and the bottom Back (same as the header Back). */
.sg-main { padding: 16px 24px 24px; }
.sg-main h1 { margin: 0; }
.sg-lead { margin-top: 6px; font-size: 15px; line-height: 22px; color: var(--text); }
.sg-me { display: flex; align-items: center; gap: 16px; margin-top: 24px; }
.sg-me img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--sand); flex: none; }
.sg-me .grow { display: flex; flex-direction: column; gap: 8px; }
.sg-link { align-self: flex-start; position: relative; padding: 0; border: 0; background: none; font: 600 14px/20px var(--font); color: var(--primary); cursor: pointer; }
.sg-link::after { content: ""; position: absolute; inset: -12px -8px; }
.sg-fields { display: flex; flex-direction: column; gap: 20px; margin-top: 24px; }
.sg-sec { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
.sg-sec > p { margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--muted); }
.sg-q { margin-top: 20px; }
.sg-q + .sg-q { padding-top: 20px; border-top: 1px solid var(--line); }
.sg-q label { display: block; font-size: 15px; line-height: 21px; font-weight: 600; color: var(--ink); }
.sg-q textarea { margin-top: 8px; min-height: 88px; }
.sg-q .row-between { margin-top: 6px; min-height: 24px; }
.sg-q .counter { margin-left: auto; font-size: 12px; color: var(--muted); }
.sg-ex { position: relative; padding: 0; border: 0; background: none; font: 600 13px/18px var(--font); color: var(--primary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.sg-ex::after { content: ""; position: absolute; inset: -12px -8px; }
.sg-vid { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 12px 0; cursor: pointer; color: var(--ink); }
.sg-vid > .ph { flex: none; font-size: 22px; }
.sg-vid b { display: block; font-size: 15px; line-height: 21px; font-weight: 600; } .sg-vid small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
.sg-pill { flex: none; position: relative; min-height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; align-items: center; font: 600 13px/1 var(--font); }
.sg-pill::after { content: ""; position: absolute; inset: -6px 0; }
html body.m .cta-bar .btn { flex: 1; }
</style>
<style>
  .sg-prev { position: relative; height: 150px; margin: 16px -24px 0; background: #888 center / cover; }
  .sg-prev .hill { position: absolute; left: 0; right: 0; bottom: -3px; width: 100%; height: 34px; fill: var(--bg); }
  .sg-lbl { position: absolute; top: 12px; left: 24px; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.92); font-size: 11px; font-weight: 700; display: flex; align-items: center; }
  .sg-av { position: absolute; left: 24px; bottom: -30px; width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 4px solid var(--bg); box-shadow: 0 6px 18px rgba(0,0,0,.14); z-index: 2; }
  .sg-me2 { padding: 8px 0 0 100px; min-height: 40px; }
  .sg-bgp { margin-top: 16px; } .sg-bgp b { display: block; font-size: 16px; line-height: 21px; font-weight: 600; } .sg-bgp small { display: block; font-size: 12px; color: var(--muted); margin: 2px 0 10px; }
  .sg-thumbs { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -24px; padding: 4px 24px; }
  .sg-thumbs button { position: relative; flex: none; width: 92px; height: 68px; border-radius: 14px; border: 0; background: #ccc center / cover; cursor: pointer; }
  .sg-thumbs button.on { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sg-thumbs button.on::after { content: "✓"; position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; display: grid; place-items: center; }
  .sg-thumbs .add { background: #F7F7F7; border: 1px dashed #DDDDDD; color: var(--muted); font-size: 22px; display: grid; place-items: center; }
</style>
</head>
<body class="m">
  <header class="appbar appbar--flow has-prog">
    <button class="icon-btn" data-go="h-builder" aria-label="Back"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
    <span class="appbar__title step-label">Section 6 of 14</span>
    <span class="spacer"></span>
    <div class="flow-prog" role="progressbar" aria-label="Section 6 of 14" aria-valuenow="6" aria-valuemin="1" aria-valuemax="14"><i style="width:43%"></i></div>
  </header>
  <main class="sg-main">
    <h1>Meet your guide</h1>
    <p class="sg-lead">Guests book people, not tours. Write it the way you'd say it.</p>

    <!-- background photo + live preview of her Host profile header (27 Nov, explore/host-pass.html #5) -->
    <div class="sg-prev" id="sgPrev" style="background-image:url(https://images.unsplash.com/photo-1643188626775-05290d1b6acb?w=900&q=70&auto=format&fit=crop)">
      <span class="sg-lbl">Preview</span>
      <svg class="hill" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 26 C70 34 140 36 220 22 C290 10 350 8 400 18 V40 H0Z"/></svg>
      <img class="sg-av" data-img="1545266241-3516e2a6e016" data-w="200" alt="Aina Rahman">
    </div>
    <div class="sg-me2"><button class="sg-link" data-sheet="camera">Change your photo</button></div>
    <div class="sg-bgp">
      <b>Background photo</b><small>From your listing photos</small>
      <div class="sg-thumbs" id="sgThumbs" role="radiogroup" aria-label="Background photo">
        <button class="on" role="radio" aria-checked="true" data-id="1643188626775-05290d1b6acb" aria-label="Banana trees"></button>
        <button role="radio" aria-checked="false" data-id="1716466205712-16bd54030abd" aria-label="Farm and palms"></button>
        <button role="radio" aria-checked="false" data-id="1530507629858-e4977d30e9e0" aria-label="Farm photo"></button>
        <button class="add" data-sheet="camera" aria-label="Add a photo"><i class="ph ph-plus" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="sg-fields">
      <div class="field"><label for="gn">Name guests see</label><input class="input" id="gn" value="Aina"></div>
      <div class="field"><label for="ht">Hometown</label><input class="input" id="ht" value="Hulu Langat, Selangor"></div>
    </div>

    <section class="sg-sec" aria-labelledby="pr-h">
      <h2 id="pr-h">In your words</h2>
      <p>Answer at least 3 of 4. Up to 60 words each.</p>
      <div id="prompts"></div>
    </section>

  </main>
  <script>
  (function () {
    var th = document.getElementById('sgThumbs'), pv = document.getElementById('sgPrev');
    th.querySelectorAll('[data-id]').forEach(function (b) { b.style.backgroundImage = 'url(' + L.img(b.dataset.id, 200) + ')'; });
    th.addEventListener('click', function (e) { var b = e.target.closest('[data-id]'); if (!b) return;
      th.querySelectorAll('[data-id]').forEach(function (x) { var on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
      pv.style.backgroundImage = 'url(' + L.img(b.dataset.id, 900) + ')'; });
  })();
  </script>
  <div class="cta-bar"><button class="btn btn--primary" id="save">Save</button></div>

  <script>
  (function () {
    /* [prompt, Aina's answer, example shown on an empty prompt] */
    var P = [
      ['Where I grew up', 'In Kampung Sungai Lui, on this farm at the forest edge. My grandmother sold kuih at the Sunday pasar pagi, and I was her helper.', ''],
      ['Why I started this', 'The farm grows more pandan than we can use. Teaching kuih keeps the old recipes alive, and the leftovers feund native trees we plant on the forest edge.', ''],
      ['Something guests always ask me', 'Why is my kuih lapis not in neat layers? Patience: one thin layer at a time, and never open the steamer early.', ''],
      ['My favourite spot', '', 'The bench under the banana trees, where we unwrap the first kuih together.']
    ];
    var h = '';
    P.forEach(function (p, i) {
      h += '<div class="sg-q"><label for="p' + i + '">' + p[0] + '</label><textarea class="textarea" id="p' + i + '"' + (p[2] ? ' placeholder="' + p[2] + '"' : '') + '>' + p[1] + '</textarea>' +
        '<div class="row-between">' + (p[1] ? '' : '<button class="sg-ex" data-ex="' + p[2] + '"><i class="ph ph-sparkle" aria-hidden="true"></i>Start from the example</button>') + '<span class="counter"></span></div></div>';
    });
    document.getElementById('prompts').innerHTML = h;
    function count(t) { var n = t.value.trim() ? t.value.trim().split(/\s+/).length : 0; t.closest('.sg-q').querySelector('.counter').textContent = n + ' / 60 words'; }
    document.querySelectorAll('.sg-q textarea').forEach(function (t) { t.addEventListener('input', function () { count(t); }); count(t); });
    document.querySelectorAll('[data-ex]').forEach(function (b) { b.addEventListener('click', function () { var t = b.closest('.sg-q').querySelector('textarea'); t.value = b.getAttribute('data-ex'); count(t); b.remove(); t.focus(); }); });
    document.getElementById('save').addEventListener('click', function () { L.toast('Saved'); setTimeout(function () { if (L.navPrev() === 'h-builder') L.back(); else L.go('h-builder'); }, 600); /* lands on the builder without stacking it twice */ });
  })();
  </script>
  <script src="../js/shared/embed.js?v=0.46.3"></script>
  <script>if (window.ProtoEmbed) ProtoEmbed.report('h-step-guide', [["Listing", "Forest-edge farm walk &amp; kuih morning"], ["Section", "6 of 14 · Meet your guide"], ["Prompts", "3 of 4 answered (3 needed)"], ["Video", "Optional"]]);</script>
  <script src="../js/shared/credits-data.js?v=0.46.3"></script>
  <script src="../js/shared/credits-badge.js?v=0.46.3"></script>
</body>
</html>
