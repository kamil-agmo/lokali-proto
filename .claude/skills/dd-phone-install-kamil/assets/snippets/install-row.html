<!-- An "Install as app" row. Add it to a settings or profile screen and load js/shared/install.js on that screen.
     It stays hidden unless installing is possible (a phone or tablet, not installed yet) and needs no extra script. -->
<button class="row" type="button" data-install-row hidden>
  <span class="row__body"><b>Install as app</b><small>Add it to your home screen for the full-screen experience</small></span>
</button>
<!-- If your CSS gives .row a display value, also add:  .row[hidden] { display: none; }  (a class's display beats the hidden attribute) -->
