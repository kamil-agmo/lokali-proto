<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F8FC;color:#111;font:15px/1.5 Helvetica,Arial,sans-serif}
.hero{background:#E7EAF6;border-bottom:1.5px solid #111;padding:44px 16px 34px}
.hero h1,.scene h2{font-family:Georgia,serif;font-weight:400;margin:0}
.hero h1{font-size:32px;line-height:1.2;max-width:580px;margin:0 auto}
main{max-width:580px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:20px}
.scene{background:#fff;border:1.5px solid #111;border-radius:4px;padding:18px 18px 16px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#C42A1C;margin-bottom:4px}
.scene h2{font-size:22px;line-height:1.25}
.scene svg{display:block;width:100%;height:auto;margin:14px 0 8px;background:#F7F8FC;border-radius:3px}
.cap{margin:0;color:#5F6272;font-size:14px}
.cap b{color:#C42A1C;font-weight:600}
svg text{font:11px Helvetica,Arial,sans-serif;fill:#5F6272;letter-spacing:.04em}
.k{color:#111}.r{color:#C42A1C}
.ln{stroke:#111;stroke-width:1.5;fill:none}.ln.r{stroke:#C42A1C}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>

<symbol id="robot" viewBox="0 0 48 56"><path d="M24 10V4" stroke="currentColor" stroke-width="1.6"/><circle cx="24" cy="3.5" r="2.5" fill="#C42A1C"/><rect x="4" y="18" width="4" height="10" rx="1.5" fill="currentColor"/><rect x="40" y="18" width="4" height="10" rx="1.5" fill="currentColor"/><rect x="8" y="10" width="32" height="26" rx="4" fill="#fff" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="21" r="3" fill="currentColor"/><circle cx="30" cy="21" r="3" fill="currentColor"/><rect x="17" y="28" width="14" height="3" rx="1.5" fill="currentColor"/><rect x="12" y="40" width="24" height="14" rx="3" fill="#DDE2F2" stroke="currentColor" stroke-width="1.6"/><circle cx="24" cy="47" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>

<symbol id="phone" viewBox="0 0 48 56"><rect x="12" y="2" width="24" height="52" rx="5" fill="#fff" stroke="currentColor" stroke-width="1.6"/><rect x="20" y="5.5" width="8" height="3" rx="1.5" fill="currentColor"/><rect x="16" y="13" width="16" height="10" rx="2" fill="#DDE2F2"/><path d="M16 28h16M16 33h11M16 38h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M20 49h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>

<symbol id="b-new" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#C42A1C"/><path d="M12 7v10M7 12h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></symbol>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C42A1C"/></marker>
</defs>
</svg>
<header class="hero"><h1>{{TITLE}}</h1></header>
<main>
{{SCENES}}
</main>
</body>
</html>
