<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lokali · Become a host: intro slides</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 400 14px/20px Inter, system-ui, -apple-system, sans-serif; color: #222; background: #F3F3F1; padding: 24px; }
  h1 { font-size: 20px; line-height: 26px; } .sub { color: #6A6A6A; margin: 4px 0 20px; max-width: 980px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .col { width: 330px; } .col > b { display: block; font-size: 15px; margin-bottom: 8px; }
  .ph { position: relative; width: 330px; height: 690px; background: #fff; border-radius: 32px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.12); border: 6px solid #111; display: flex; flex-direction: column; }
  .img { position: relative; height: 380px; background: #888 center / cover; flex: none; }
  .img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 30%); }
  .img svg.hill { position: absolute; z-index: 2; left: 0; right: 0; bottom: -3px; width: 100%; height: 36px; fill: #fff; }
  .skip { position: absolute; z-index: 3; top: 44px; right: 18px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.92); font-size: 13px; font-weight: 600; display: flex; align-items: center; }
  .tx { padding: 10px 24px 0; flex: 1; } .tx h2 { font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; } .tx p { font-size: 15px; line-height: 22px; color: #3D3D3D; margin-top: 8px; }
  .ex { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: #F1F6F2; font-size: 14px; color: #1C522C; } .ex b { font-size: 20px; font-weight: 800; white-space: nowrap; }
  .ft { padding: 0 24px 26px; display: flex; align-items: center; gap: 12px; }
  .dots { display: flex; gap: 6px; } .dots i { width: 7px; height: 7px; border-radius: 4px; background: #DDDDDD; } .dots i.on { width: 20px; background: #222; }
  .nx { margin-left: auto; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #DDDDDD; font-weight: 600; display: flex; align-items: center; }
  .st { margin-left: auto; height: 48px; flex: 1; border-radius: 999px; background: #D7263D; color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .steps { padding: 70px 24px 0; flex: 1; } .steps h2 { font-size: 26px; line-height: 32px; font-weight: 700; } .steps p { font-size: 15px; color: #6A6A6A; margin-top: 6px; }
  .s { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid #EBEBEB; } .s:first-of-type { margin-top: 14px; border-top: 0; } .s span { width: 28px; height: 28px; border-radius: 50%; background: #222; color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none; } .s b { display: block; font-size: 15px; } .s small { display: block; font-size: 12px; color: #6A6A6A; }
  .notes { width: 330px; background: #fff; border-radius: 16px; padding: 18px 20px; } .notes h2 { font-size: 16px; margin-bottom: 8px; } .notes li { margin: 6px 0 6px 18px; font-size: 13px; line-height: 19px; }
</style>
</head>
<body>
<h1>Become a host: 3 intro slides, then the steps</h1>
<p class="sub">Shown the first time someone taps "Become a host". Swipe or Next; Skip jumps to the steps page (today's Intro). One message per slide, general to any kind of experience.</p>
<div class="wrap" id="w"></div>
<script>
function u(id, w) { return 'https://images.unsplash.com/photo-' + id + '?w=' + (w || 700) + '&q=70&auto=format&fit=crop'; }
var HILL = '<svg class="hill" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 26 C70 34 140 36 220 22 C290 10 350 8 400 18 V40 H0Z"/></svg>';
function dots(n) { var h = ''; for (var i = 0; i < 4; i++) h += '<i' + (i === n ? ' class="on"' : '') + '></i>'; return '<span class="dots">' + h + '</span>'; }
function slide(img, t, p, extra, n) { return '<div class="ph"><div class="img" style="background-image:url(' + u(img) + ')"><span class="skip">Skip</span>' + HILL + '</div><div class="tx"><h2>' + t + '</h2><p>' + p + '</p>' + (extra || '') + '</div><div class="ft">' + dots(n) + '<span class="nx">Next</span></div></div>'; }
var S = [
  ['1 · Share what you know', slide('1726091983472-a7da2540c492', 'Share what you know', 'Small groups, your place, your pace. A walk, a craft, a meal or a stay: you decide what guests do with you.', '', 0)],
  ['2 · Get paid within about 24 hours', slide('1534953342533-7711c98712be', 'Get paid within about 24 hours', 'Set your own price. Lokali keeps 15% and sends the rest to your bank about a day after each experience.', '', 1)],
  ['3 · Do good while you host', slide('1625758476104-f2ed6c81248f', 'Do good while you host', 'Part of every ticket goes to a cause you choose, and guests see it on your listing.', '', 2)],
  ['4 · How to apply (today\'s Intro, kept)', '<div class="ph"><div class="steps"><h2>Apply in 4 steps</h2><p>About 10 minutes. Save and come back any time.</p>' +
    '<div class="s"><span>1</span><div><b>About you</b><small>Filled in from your account</small></div></div><div class="s"><span>2</span><div><b>Your business</b><small>Details and where you\'ll host</small></div></div><div class="s"><span>3</span><div><b>Documents</b><small>IC, SSM certificate, licences</small></div></div><div class="s"><span>4</span><div><b>Check and submit</b><small>We reply within 2 working days</small></div></div></div>' +
    '<div class="ft">' + dots(3) + '<span class="st">Start</span></div></div>']
];
document.getElementById('w').innerHTML = S.map(function (s) { return '<div class="col"><b>' + s[0] + '</b>' + s[1] + '</div>'; }).join('') +
  '<div class="notes"><h2>MIMS</h2><ul><li><b>Why slides here:</b> becoming a host changes the whole app (weight matches consequence), so a short why before the form helps.</li>' +
  '<li><b>One message each:</b> people (1), money (2), impact (3); the 15% appears once, on slide 2 (cut from the steps page).</li>' +
  '<li><b>Skip</b> on every slide; shown once (first time only).</li>' +
  '<li><b>General:</b> no single host, listing or number; the words and photos fit any experience (walk, craft, food, stay) and any cause.</li>' +
  '<li><b>Requirements:</b> self-serve host sign-up is in the brief; the slides are a suggestion (Q19).</li></ul></div>';
</script>
</body>
</html>
