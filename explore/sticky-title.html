<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lokali · Experience page: header after scrolling</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 400 14px/20px Inter, system-ui, sans-serif; color: #222; background: #F3F3F1; padding: 24px; }
  h1 { font-size: 18px; } .sub { color: #6A6A6A; margin: 4px 0 20px; max-width: 900px; }
  .row { display: grid; grid-template-columns: 220px auto; gap: 24px; align-items: center; margin-bottom: 26px; }
  .row b { display: block; font-size: 15px; } .row p { font-size: 13px; line-height: 18px; color: #6A6A6A; margin-top: 4px; }
  .row.rec b { color: #D7263D; } .row.rec .hd { outline: 2px solid #D7263D; outline-offset: 3px; }

  /* the scrolled header, drawn at phone width (402px) with the live page's sizes, then zoomed */
  .hd { width: 402px; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.10); zoom: 1.3; }
  .bar { display: flex; align-items: center; gap: 4px; padding: 0 8px; min-height: 44px; }
  .ib { width: 44px; height: 44px; flex: none; display: grid; place-items: center; font-size: 22px; color: #222; }
  .t { flex: 1; min-width: 0; font-size: 16px; line-height: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .t.c { text-align: center; }
  .t.two { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 15px; line-height: 19px; padding: 6px 0; }
  .tabs { display: flex; gap: 4px; overflow: hidden; padding: 0 12px; border-bottom: 1px solid #EBEBEB; }
  .tabs a { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: 15px; font-weight: 500; color: #222; border-bottom: 3px solid transparent; }
  .tabs a.on { font-weight: 600; color: #2F5D3A; border-bottom-color: #2F5D3A; }
  .hd.red .tabs a.on { color: #D7263D; border-bottom-color: #D7263D; }
</style>
</head>
<body>
<h1>Header after scrolling</h1>
<p class="sub">The header that slides in once you scroll past the photo, drawn at the live page's sizes and zoomed. Compare how much of the place name shows and what sits beside it.</p>
<div id="w"></div>
<script>
var NAME = 'Mangrove &amp; fireflies by kampung boat';
var TABS = '<nav class="tabs"><a class="on">Overview</a><a>The story</a><a>Itinerary</a><a>What\'s included</a></nav>';
var BACK = '<span class="ib"><svg width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="#222" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="160 208 80 128 160 48"/></svg></span>';
var ICONS = '<span class="ib"><svg width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="#222" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><polyline points="86 82 128 40 170 82"/><line x1="128" y1="144" x2="128" y2="40"/><path d="M176 104h24a8 8 0 0 1 8 8v96a8 8 0 0 1-8 8H56a8 8 0 0 1-8-8v-96a8 8 0 0 1 8-8h24"/></svg></span><span class="ib"><svg width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="#222" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M128 216S28 160 28 92a52 52 0 0 1 100-20 52 52 0 0 1 100 20c0 68-100 124-100 124z"/></svg></span>';
var V = [
  ['Now', 'Name between Back and two icons. It is cut off.', BACK + '<span class="t c">' + NAME + '</span>' + ICONS, ''],
  ['A · Left name, icons kept', 'Name starts right after Back. Still one line, still cut off.', BACK + '<span class="t">' + NAME + '</span>' + ICONS, ''],
  ['B · Two lines, icons kept', 'Name wraps to 2 lines, so all of it shows. The header gets taller.', BACK + '<span class="t two">' + NAME + '</span>' + ICONS, ''],
  ['C · Back + name only (recommended)', 'Share and Save stay on the photo at the top. The scrolled header keeps Back and the name, which fits on one line. Selected tab in Airy red.', BACK + '<span class="t">' + NAME + '</span>', ' red']
];
document.getElementById('w').innerHTML = V.map(function (v, i) {
  return '<div class="row' + (i === 3 ? ' rec' : '') + '"><div><b>' + v[0] + '</b><p>' + v[1] + '</p></div>' +
    '<div class="hd' + v[3] + '"><div class="bar">' + v[2] + '</div>' + TABS + '</div></div>';
}).join('');
</script>
</body>
</html>
